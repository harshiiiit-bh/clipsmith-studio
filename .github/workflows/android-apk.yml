name: ClipSmith Android APK

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "ai-creator-tools.js"
      - "memory-vault.js"
      - "transcribe-worker.js"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "ai-creator-tools.js"
      - "memory-vault.js"
      - "transcribe-worker.js"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clipsmith-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Prepare web assets and create Android project
        run: npm run android:init

      - name: Set a unique Android version for this build
        env:
          APK_VERSION_CODE: ${{ github.run_number }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const path = 'android/app/build.gradle';
          let gradle = readFileSync(path, 'utf8');
          const code = Number(process.env.APK_VERSION_CODE);
          if (!Number.isInteger(code) || code < 1) throw new Error('Invalid Android version code');
          if (!/versionCode\\s+\\d+/.test(gradle)) throw new Error('Could not locate Android versionCode');
          gradle = gradle.replace(/versionCode\\s+\\d+/, `versionCode ${code}`);
          gradle = gradle.replace(/versionName\\s+['"][^'"]+['"]/, `versionName '1.0.${code}'`);
          writeFileSync(path, gradle);
          NODE

      - name: Build installable APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Prepare APK download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ClipSmith-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSmith-Android-APK
          path: ClipSmith-Android.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          target_commitish: main
          name: ClipSmith Android APK (Latest)
          body: |
            Latest automated ClipSmith Studio Android build.
            
            Install the APK on Android. If Android blocks installation, allow your browser or file manager to install unknown apps for this file.
            
            The app autosaves edits and can remember the source video on this device when storage allows. Large video processing and first-time Whisper model downloads can still require free storage and internet access.
            
            This direct-download APK is debug-signed for sideload installation. It is not a Play Store release.
          files: ClipSmith-Android.apk
          overwrite_files: true
          make_latest: true
          fail_on_unmatched_files: true
