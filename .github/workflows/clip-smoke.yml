name: ClipSmith smoke checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "export-overlay.js"
      - "styles.css"
      - "studio-2.css"
      - "studio-polish.css"
      - "brand-finish.css"
      - "clipsmith-logo.svg"
      - "clipsmith-mark.svg"
      - "typography-enhancements.js"
      - "workspace-controls.js"
      - "power-tools.js"
      - "runtime-guard.js"
      - "package.json"
      - "scripts/**"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "transcribe-worker.js"
      - "ai-creator-tools.js"
      - "mobile-memory.js"
      - "tests/**"
      - ".github/workflows/clip-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "export-overlay.js"
      - "styles.css"
      - "studio-2.css"
      - "studio-polish.css"
      - "brand-finish.css"
      - "clipsmith-logo.svg"
      - "clipsmith-mark.svg"
      - "typography-enhancements.js"
      - "workspace-controls.js"
      - "power-tools.js"
      - "runtime-guard.js"
      - "package.json"
      - "scripts/**"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "transcribe-worker.js"
      - "ai-creator-tools.js"
      - "mobile-memory.js"
      - "tests/**"
      - ".github/workflows/clip-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser-test runner
        run: npm install --no-save --no-package-lock playwright
      - name: Install Chromium for real browser checks
        run: npx playwright install --with-deps chromium
      - name: Syntax and editor-feature checks
        run: |
          node --check app.js
          node --check export-overlay.js
          node --check power-tools.js
          node --check runtime-guard.js
          node --check subtitle-tools.js
          node --check workspace-controls.js
          node tests/smoke.mjs
          node tests/editor-upgrade-smoke.mjs
          node tests/ui-responsive-smoke.mjs
          node tests/power-tools-smoke.mjs
          node tests/browser-smoke.mjs
