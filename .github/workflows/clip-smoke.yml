name: ClipSmith smoke checks
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "studio-2.css"
      - "package.json"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "transcribe-worker.js"
      - "ai-creator-tools.js"
      - "mobile-memory.js"
      - "tests/**"
      - ".github/workflows/clip-smoke.yml"
  pull_request:
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "creator-assistant.js"
      - "editor-tools.js"
      - "subtitle-tools.js"
      - "transcribe-worker.js"
      - "ai-creator-tools.js"
      - "mobile-memory.js"
      - "tests/**"
      - ".github/workflows/clip-smoke.yml"
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and editor-feature checks
        run: |
          node tests/smoke.mjs
          node tests/editor-upgrade-smoke.mjs
          node tests/ui-responsive-smoke.mjs
