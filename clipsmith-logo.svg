<svg xmlns="http://www.w3.org/2000/svg" width="360" height="76" viewBox="0 0 360 76" role="img" aria-labelledby="title desc">
  <title id="title">ClipSmith</title>
  <desc id="desc">ClipSmith video editing studio logo with a gradient play frame and film-cut details.</desc>
  <defs>
    <linearGradient id="mark" x1="4" y1="6" x2="66" y2="68" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D9CFFF"/>
      <stop offset=".42" stop-color="#A78BFA"/>
      <stop offset=".74" stop-color="#855CFF"/>
      <stop offset="1" stop-color="#4CC9F0"/>
    </linearGradient>
    <linearGradient id="word" x1="116" y1="13" x2="327" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FAFAFF"/>
      <stop offset=".52" stop-color="#D9D0FF"/>
      <stop offset="1" stop-color="#AC8BFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="15" y1="12" x2="61" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6B7FF"/>
      <stop offset="1" stop-color="#7657FF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(3 6)">
    <rect x="2" y="2" width="62" height="62" rx="19" fill="#121421" stroke="#B09BFF" stroke-opacity=".45"/>
    <rect x="7" y="7" width="52" height="52" rx="15" fill="url(#mark)" opacity=".12"/>
    <path d="M14 17.5V49a5 5 0 0 0 5 5h25.5a5 5 0 0 0 5-5V17.5a5 5 0 0 0-5-5H19a5 5 0 0 0-5 5Z" fill="none" stroke="url(#mark)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M29.3 22.3a2 2 0 0 1 2.1 0l13.2 8.1a2 2 0 0 1 0 3.4l-13.2 8.1a2 2 0 0 1-3.1-1.7V24a2 2 0 0 1 1-1.7Z" fill="url(#mark)" filter="url(#glow)"/>
    <path d="M14.5 21.5h6M14.5 29.5h6M14.5 37.5h6M14.5 45.5h6" stroke="#F6F2FF" stroke-opacity=".92" stroke-width="2.3" stroke-linecap="round"/>
    <path d="m45 48 8 8M49.2 43.8l-6.7 6.7" stroke="#7CDDF6" stroke-width="2.7" stroke-linecap="round"/>
    <circle cx="43.7" cy="51.3" r="4.2" fill="#121421" stroke="#7CDDF6" stroke-width="2.5"/>
  </g>
  <g font-family="Inter, Manrope, Arial, sans-serif" font-weight="800" letter-spacing="-1.7">
    <text x="82" y="39.5" font-size="31" fill="#F5F4FF">Clip<tspan fill="url(#word)">Smith</tspan></text>
  </g>
  <text x="84" y="57.5" font-family="Inter, Manrope, Arial, sans-serif" font-size="8.7" font-weight="700" letter-spacing="2.55" fill="#9298AD">VIDEO · CUT · CREATE</text>
  <path d="M84 65H333" stroke="url(#word)" stroke-opacity=".25" stroke-width=".8"/>
  <circle cx="339" cy="65" r="1.7" fill="#9F83FF"/>
</svg>